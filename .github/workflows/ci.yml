name: ci
on:
  push:
    branches: [main, dev/mcpp-index-integration]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - run: xpkgindex-update --help
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a literal index fixture
        run: |
          mkdir -p pkgs/f
          printf '%s\n' 'package = { name = "foo", xpm = {} }' > pkgs/f/foo.lua
      - name: Exercise the composite Action
        uses: ./
        with:
          mode: check
          token: ${{ github.token }}
