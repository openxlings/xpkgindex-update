[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpkgindex-update"
version = "0.1.0.dev0"
description = "Append-only package index updates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "openxlings contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
xpkgindex-update = "xpkgindex_update.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
